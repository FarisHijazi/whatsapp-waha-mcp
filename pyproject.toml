[project]
name = "whatsapp-waha-mcp"
version = "1.0.0"
description = "MCP server for WAHA (WhatsApp HTTP API)"
authors = [
    {name = "WAHA MCP", email = "waha@example.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
whatsapp-waha-mcp = "whatsapp_waha_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whatsapp_waha_mcp"]
